[project]
name = "rag-eval-lab"
version = "0.1.0"
description = "Measuring retrieval quality in a RAG pipeline instead of assuming it"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
